<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari & Ganti Teks Dokumen Word (.docx)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PizZip untuk Unzip & Zip File Word -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.4/pizzip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen py-8 px-4">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-indigo-700 text-white p-6 rounded-2xl shadow-md flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="replace" class="w-6 h-6 text-indigo-200"></i>
                    Batch Replacer Word Perangkat
                </h1>
                <p class="text-xs text-indigo-200 mt-1">Ganti Nama Sekolah, Guru, Kepsek, & Mapel langsung dari file Word lama.</p>
            </div>
            <span class="bg-indigo-800 text-indigo-100 text-xs px-3 py-1 rounded-full border border-indigo-600">v2.0 Direct Replace</span>
        </div>

        <!-- Form Pasangan Cari & Ganti -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="font-bold text-slate-900 text-sm border-b pb-3 flex items-center justify-between">
                <span class="flex items-center gap-2">
                    <i data-lucide="search-code" class="w-4 h-4 text-indigo-600"></i>
                    Daftar Teks yang Ingin Diganti
                </span>
                <button onclick="addPairRow()" class="text-xs bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg border border-indigo-200 hover:bg-indigo-100 font-medium flex items-center gap-1">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Baris
                </button>
            </h2>

            <div id="pairContainer" class="space-y-3">
                <!-- Baris 1: Nama Sekolah -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pair-row p-3 bg-slate-50 rounded-xl border border-slate-200 relative">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Teks Lama di Dokumen Word</label>
                        <input type="text" placeholder="Contoh: Pesantren Terpadu Al-Fauzan" class="old-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Ganti Menjadi (Teks Baru)</label>
                        <input type="text" placeholder="Contoh: SMP Negeri 1 Lumajang" class="new-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <!-- Baris 2: Nama Guru -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pair-row p-3 bg-slate-50 rounded-xl border border-slate-200 relative">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Nama Guru Lama</label>
                        <input type="text" placeholder="Contoh: Ahmad Subagyo, S.Pd." class="old-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Nama Guru Baru</label>
                        <input type="text" placeholder="Contoh: Moh. Joharul Yusuf, S.Pd." class="new-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <!-- Baris 3: Nama Kepala Sekolah -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pair-row p-3 bg-slate-50 rounded-xl border border-slate-200 relative">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Nama Kepala Sekolah Lama</label>
                        <input type="text" placeholder="Contoh: H. Mahmud, M.Pd." class="old-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-500 mb-1">Nama Kepala Sekolah Baru</label>
                        <input type="text" placeholder="Contoh: Dra. Hj. Siti Maryam, M.Pd." class="new-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
            </div>
        </div>

        <!-- Box Upload & Eksekusi -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="font-bold text-slate-900 text-sm border-b pb-3 flex items-center gap-2">
                <i data-lucide="file-up" class="w-4 h-4 text-indigo-600"></i> Pilih File Word (.docx) Anda
            </h2>
            
            <div class="border-2 border-dashed border-indigo-200 rounded-2xl p-6 text-center bg-indigo-50/30 hover:bg-indigo-50 transition cursor-pointer relative">
                <input type="file" id="fileInput" multiple accept=".docx" class="absolute inset-0 opacity-0 cursor-pointer" onchange="updateFileList()">
                <i data-lucide="upload-cloud" class="w-10 h-10 text-indigo-500 mx-auto mb-2"></i>
                <p class="text-xs font-semibold text-slate-700">Klik di sini untuk memilih file Word (.docx)</p>
                <p class="text-[10px] text-slate-400 mt-1">Dapat memilih banyak file sekaligus</p>
            </div>

            <div id="fileList" class="space-y-1.5 text-xs max-h-40 overflow-y-auto"></div>

            <button onclick="processBatchReplace()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition shadow-lg mt-4">
                <i data-lucide="play-circle" class="w-4 h-4"></i>
                <span>Proses & Download File Hasil Perubahan</span>
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function addPairRow() {
            const container = document.getElementById('pairContainer');
            const row = document.createElement('div');
            row.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3 pair-row p-3 bg-slate-50 rounded-xl border border-slate-200 relative';
            row.innerHTML = `
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1">Teks Lama yang Ingin Diganti</label>
                    <input type="text" placeholder="Teks lama..." class="old-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-500 mb-1">Ganti Menjadi (Teks Baru)</label>
                    <input type="text" placeholder="Teks baru..." class="new-text w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            `;
            container.appendChild(row);
        }

        function updateFileList() {
            const input = document.getElementById('fileInput');
            const listContainer = document.getElementById('fileList');
            listContainer.innerHTML = '';

            if (input.files.length === 0) return;

            Array.from(input.files).forEach(file => {
                const item = document.createElement('div');
                item.className = 'p-2 bg-slate-100 rounded-lg flex items-center justify-between text-[11px] text-slate-700';
                item.innerHTML = `<span class="truncate font-medium">${file.name}</span> <span class="text-indigo-600 font-bold">Siap</span>`;
                listContainer.appendChild(item);
            });
        }

        function processBatchReplace() {
            const input = document.getElementById('fileInput');
            if (input.files.length === 0) {
                alert('Silakan pilih minimal satu file .docx!');
                return;
            }

            // Kumpulkan daftar teks lama -> teks baru
            const replacements = [];
            document.querySelectorAll('.pair-row').forEach(row => {
                const oldVal = row.querySelector('.old-text').value.trim();
                const newVal = row.querySelector('.new-text').value.trim();
                if (oldVal !== '') {
                    replacements.push({ oldText: oldVal, newText: newVal });
                }
            });

            if (replacements.length === 0) {
                alert('Isi minimal satu pasangan Teks Lama dan Teks Baru!');
                return;
            }

            // Memproses tiap file .docx
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const zip = new PizZip(e.target.result);
                        
                        // Pindai semua file XML di dalam struktur .docx (document, header, footer)
                        Object.keys(zip.files).forEach(filename => {
                            if (filename.startsWith('word/') && filename.endsWith('.xml')) {
                                let xmlContent = zip.files[filename].asText();
                                
                                // Ganti teks secara langsung
                                replacements.forEach(item => {
                                    xmlContent = xmlContent.split(item.oldText).join(item.newText);
                                });

                                zip.file(filename, xmlContent);
                            }
                        });

                        const blob = zip.generate({
                            type: 'blob',
                            mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                        });

                        saveAs(blob, "Perubahan_" + file.name);

                    } catch (err) {
                        alert('Gagal memproses file ' + file.name + '. Pastikan file tidak terenkripsi.');
                        console.error(err);
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }
    </script>
</body>
</html>
